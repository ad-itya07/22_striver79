<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striver 79 — DSA Tracker</title>
    <meta name="description" content="Track your progress on the Striver 79 Last Moment DSA Sheet. Mark problems as done, star them for revision, and add personal notes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── HEADER ─────────────────────────────────────────────── -->
    <header class="header" id="main-header">
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">Striver 79</span>
            <span class="logo-sub">DSA Tracker</span>
          </div>
        </div>

        <!-- Header overall progress -->
        <div class="header-progress-wrap">
          <div class="header-progress-text">
            <span>Overall Progress</span>
            <span class="header-progress-count"><strong id="progress-done">0</strong> / <span id="progress-total">79</span></span>
          </div>
          <div class="header-progress-bar">
            <div class="header-progress-fill" id="header-progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Stat pills -->
        <div class="stat-pills">
          <div class="pill pill-done">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            <span id="stat-done">0</span> Solved
          </div>
          <div class="pill pill-star">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span id="stat-starred">0</span> Starred
          </div>
          <div class="pill pill-note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
            <span id="stat-notes">0</span> Notes
          </div>
        </div>
      </div>
    </header>

    <!-- ── FILTER BAR ──────────────────────────────────────────── -->
    <div class="filter-bar" id="filter-bar">
      <div class="filter-bar-inner">
        <div class="filter-tabs" role="tablist" aria-label="Filter questions">
          <button class="tab active" data-filter="all" role="tab" id="tab-all">All Questions</button>
          <button class="tab" data-filter="starred" role="tab" id="tab-starred">⭐ Starred</button>
          <button class="tab" data-filter="undone" role="tab" id="tab-undone">Not Done</button>
          <button class="tab" data-filter="done" role="tab" id="tab-done">Completed</button>
        </div>

        <div class="filter-actions">
          <button class="action-btn" id="btn-expand-all" title="Expand all topics">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 8l5-5 5 5M7 16l5 5 5-5"/>
            </svg>
            Expand All
          </button>
          <button class="action-btn" id="btn-collapse-all" title="Collapse all topics">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4l5 5 5-5M7 20l5-5 5 5"/>
            </svg>
            Collapse All
          </button>
        </div>

        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search questions…" aria-label="Search questions" />
        </div>
      </div>
    </div>

    <!-- ── MAIN CONTENT ───────────────────────────────────────── -->
    <main class="main" id="main-content">
      <!-- Loading skeleton -->
      <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <p>Loading your tracker…</p>
      </div>

      <!-- Topics container (filled by JS) -->
      <div id="topics-container" class="topics-container" style="display:none"></div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-icon">🔍</div>
        <h3>No questions found</h3>
        <p>Try adjusting your filter or search query.</p>
      </div>
    </main>

    <!-- ── TOAST ─────────────────────────────────────────────── -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- ── NOTES MODAL ─────────────────────────────────────────── -->
    <div id="notes-modal" class="modal-overlay" style="display:none">
      <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
            <h3 id="modal-title">Personal Notes</h3>
          </div>
          <div class="modal-controls">
            <div class="modal-tabs">
              <button id="modal-tab-edit" class="modal-tab active">✏️ Edit</button>
              <button id="modal-tab-preview" class="modal-tab">👁️ Preview</button>
              <button id="modal-tab-split" class="modal-tab">📑 Split View</button>
            </div>
            <span class="save-indicator" id="modal-save-ind">✓ Saved</span>
            <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">&times;</button>
          </div>
        </div>

        <div class="modal-body" id="modal-body">
          <div class="modal-editor-pane" id="modal-editor-pane">
            <textarea id="modal-textarea" class="modal-textarea" placeholder="Write your notes here using Markdown formatting…&#10;&#10;Examples:&#10;# Heading&#10;**Bold**, *Italic*, `code`&#10;- List item 1&#10;- List item 2&#10;<hr>"></textarea>
          </div>
          <div class="modal-preview-pane" id="modal-preview-pane" style="display:none">
            <div id="modal-preview-content" class="markdown-preview"></div>
          </div>
        </div>

        <div class="modal-footer">
          <span class="modal-hint">Markdown supported: <code># Header</code>, <code>**bold**</code>, <code>- list</code>, <code>`code`</code>, <code>&lt;hr&gt;</code></span>
          <button id="modal-done-btn" class="modal-done-btn">Done</button>
        </div>
      </div>
    </div>

    <!-- Marked JS for rich Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
